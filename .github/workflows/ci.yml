name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, migrasi, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lapangin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lapangin_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lapangin_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: SECRET_KEY acak khusus CI
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrasi dari nol dan cek model sinkron
        run: alembic upgrade head && alembic check

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build produksi
        run: npm run build

  docker:
    name: Docker - build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build image yang dipakai Render
        run: docker build -t lapangin:ci .

  migrate:
    name: Migrasi database Neon
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # secret repo berisi connection string Neon (direct), job dilewati kalau belum diisi
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        if: env.DATABASE_URL != ''

      - uses: actions/setup-python@v7
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: pip install -r requirements.txt

      - name: alembic upgrade head
        if: env.DATABASE_URL != ''
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          alembic upgrade head

      - name: Secret NEON_DATABASE_URL belum ada
        if: env.DATABASE_URL == ''
        working-directory: .
        run: echo "Secret NEON_DATABASE_URL belum diisi, migrasi dilewati"
