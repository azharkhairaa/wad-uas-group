# Blueprint Render untuk satu web service gratis (FastAPI + build Vue), database PostgreSQL di Neon
services:
  - type: web
    name: lapangin
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # deploy hanya kalau workflow CI di GitHub lulus
    autoDeployTrigger: checksPass
    envVars:
      # connection string Neon (direct, bukan pooled), diisi saat Blueprint pertama dibuat
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TOKEN_MENIT
        value: "120"
