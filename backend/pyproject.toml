[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]  # Depends() memang dipanggil di default argument

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.ruff.lint.per-file-ignores]
# assert di test dibiarkan satu baris supaya mudah dibaca
"tests/*" = ["E501"]
